name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, animevost, android]
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: true

      - name: Verify build environment
        run: |
          java -version
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"

      - name: Run unit tests
        run: >-
          ./gradlew --no-daemon --max-workers=1
          -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process
          testDebugUnitTest :app:testDevDebugUnitTest

      - name: Decode keystore
        run: printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/keystore.jks"

      - name: Build release APKs
        run: >-
          ./gradlew --no-daemon --max-workers=1
          -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process
          :app:assembleProdRelease
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APKs
        run: |
          VERSION="${{ github.ref_name }}"
          for apk in app/build/outputs/apk/prod/release/*.apk; do
            abi=$(basename "$apk" | sed 's/^app-prod-//' | sed 's/-release\.apk$//')
            mv "$apk" "app/build/outputs/apk/prod/release/AnimeVost-${VERSION}-${abi}.apk"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_NOTES=$(printf '%s\n' \
            '## Установка' \
            '' \
            'Выберите APK под своё устройство:' \
            '' \
            '| Файл | Устройство |' \
            '|---|---|' \
            '| `arm64-v8a` | Большинство современных Android-устройств |' \
            '| `armeabi-v7a` | Старые 32-битные устройства |' \
            '| `x86_64` | Эмуляторы |' \
            '| `universal` | Если не знаете какой выбрать |' \
            '' \
            '> Перед установкой разрешите установку из неизвестных источников в настройках устройства.')
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/prod/release/AnimeVost-*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "AnimeVost $GITHUB_REF_NAME" \
            --notes "$RELEASE_NOTES"

      - name: Clean sensitive files and workspace
        if: always()
        run: |
          rm -f "${{ github.workspace }}/keystore.jks"
          git submodule foreach --recursive git clean -ffdx
          git clean -ffdx
