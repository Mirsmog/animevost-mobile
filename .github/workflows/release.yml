name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, animevost, android]
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Verify build environment
        run: |
          java -version
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"

      - name: Decode keystore
        run: printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/keystore.jks"

      - name: Build release APKs
        run: ./gradlew --no-daemon --max-workers=2 test lintRelease assembleRelease
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APKs
        run: |
          VERSION="${{ github.ref_name }}"
          for apk in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$apk" | sed 's/^app-//' | sed 's/-release\.apk$//')
            mv "$apk" "app/build/outputs/apk/release/AnimeVost-${VERSION}-${abi}.apk"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AnimeVost ${{ github.ref_name }}
          files: app/build/outputs/apk/release/AnimeVost-*.apk
          body: |
            ## Установка

            Выберите APK под своё устройство:

            | Файл | Устройство |
            |---|---|
            | `arm64-v8a` | Большинство современных Android-устройств |
            | `armeabi-v7a` | Старые 32-битные устройства |
            | `x86_64` | Эмуляторы |
            | `universal` | Если не знаете какой выбрать |

            > Перед установкой разрешите установку из неизвестных источников в настройках устройства.

      - name: Clean sensitive files and workspace
        if: always()
        run: |
          rm -f "${{ github.workspace }}/keystore.jks"
          git submodule foreach --recursive git clean -ffdx
          git clean -ffdx
