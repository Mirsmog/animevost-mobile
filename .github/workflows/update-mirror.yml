name: Update Mirror URL

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  update-mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch and parse mirror URL
        id: parse
        run: |
          CONTENT=$(curl -s --max-time 15 https://animevost.org || echo "")
          if [ -z "$CONTENT" ]; then
            echo "::error::Failed to fetch animevost.org"
            exit 1
          fi

          MIRROR_URL=$(echo "$CONTENT" | python3 -c "
          import sys, re
          content = sys.stdin.read()
          match = re.search(r'interDub.*?href=\"(https?://[^\"]*vost\.pw[^\"]*)\"', content, re.DOTALL)
          if match:
              print(match.group(1).rstrip('/'))
          else:
              print('')
          ")

          if [ -z "$MIRROR_URL" ]; then
            echo "::error::Could not find mirror URL in page"
            exit 1
          fi

          echo "mirror_url=$MIRROR_URL" >> $GITHUB_OUTPUT
          echo "Found mirror: $MIRROR_URL"

      - name: Update mirror.json if changed
        run: |
          MIRROR_URL="${{ steps.parse.outputs.mirror_url }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          CURRENT_MIRROR=$(python3 -c "
          import json
          try:
              with open('mirror.json') as f:
                  print(json.load(f).get('mirror', ''))
          except Exception:
              print('')
          ")

          if [ "$CURRENT_MIRROR" = "$MIRROR_URL" ]; then
            echo "Mirror URL unchanged ($MIRROR_URL), nothing to commit"
            exit 0
          fi

          python3 -c "
          import json
          data = {
              'primary': 'https://animevost.org',
              'mirror': '$MIRROR_URL',
              'updated_at': '$TIMESTAMP'
          }
          with open('mirror.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          "

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mirror.json
          git commit -m "chore: update mirror to $MIRROR_URL"
          git push
